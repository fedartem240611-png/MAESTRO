<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MaEstro AI</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; padding: 15px; transition: background 0.3s, color 0.3s; overflow: hidden; }
    html { height: -webkit-fill-available; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #111; flex-shrink: 0; }
    header h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; }
    
    .custom-btn { background: #111; border: 1px solid #222; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; gap: 5px; -webkit-tap-highlight-color: transparent; }
    .custom-btn span { background: #fff; color: #000; font-size: 0.6rem; padding: 2px 4px; border-radius: 4px; font-weight: 900; }

    .chat-container { flex: 1; overflow-y: auto; margin: 15px 0; padding: 5px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg.user { background: #111; align-self: flex-end; border: 1px solid #222; color: #eee; }
    .msg.ai { background: #fff; color: #000; align-self: flex-start; font-weight: 500; }
    
    .status-bar { font-size: 0.7rem; color: #444; text-align: center; margin-bottom: 8px; flex-shrink: 0; letter-spacing: 0.5px; text-transform: uppercase; }

    .input-area { display: flex; gap: 8px; width: 100%; max-width: 500px; margin: 0 auto; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
    .input-area input { flex: 1; background: #050505; border: 1px solid #222; border-radius: 12px; padding: 14px; color: #fff; font-size: 0.95rem; outline: none; }
    .input-area input:focus { border-color: #333; }
    .input-area button { background: #fff; color: #000; border: none; padding: 0 20px; border-radius: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; font-size: 0.85rem; -webkit-tap-highlight-color: transparent; }
    
    body.theme-noir { background: #0a0a0a; color: #fff; }
    body.theme-noir .msg.user { background: #000; border-color: #333; }
    body.theme-milano { background: #1a1a1a; color: #e5e5e5; }
    body.theme-milano .msg.user { background: #262626; border-color: #333; }
    body.theme-milano .custom-btn { background: #262626; }
  </style>
</head>
<body>

  <header>
    <h1>MaEstro</h1>
    <button class="custom-btn" id="custom-toggle">Custom <span>NEW</span></button>
  </header>

  <div class="chat-container" id="chat">
    <div class="msg ai">System ready. No servers. No logs. Ask me anything.</div>
  </div>

  <div class="status-bar" id="status">Core status: 100% Offline Active</div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chat');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const customToggle = document.getElementById('custom-toggle');
    // Кнопка кастомизации жестко переключает фоны на мобилках
    let currentTheme = 0;
    customToggle.onclick = function(e) {
      e.preventDefault();
      const themes = ['', 'theme-noir', 'theme-milano'];
      document.body.className = '';
      currentTheme = (currentTheme + 1) % themes.length;
      if (themes[currentTheme]) {
        document.body.classList.add(themes[currentTheme]);
      }
    };

    // Рабочая отправка сообщений с авто-скроллом
    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      userInput.value = '';
      
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.innerText = text;
      chatContainer.appendChild(userDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      
      setTimeout(() => {
        const aiDiv = document.createElement('div');
        aiDiv.className = 'msg ai';
        aiDiv.innerText = "MaEstro core response loaded locally.";
        chatContainer.appendChild(aiDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 400);
    }

    sendBtn.onclick = function(e) { e.preventDefault(); sendMessage(); };
    userInput.onkeypress = function(e) { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } };
  </script>
</body>
</html>
