<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaEstro AI</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 20px; transition: background 0.3s, color 0.3s; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #111; }
    header h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; }
    .custom-btn { background: #111; border: 1px solid #222; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
    .custom-btn span { background: #fff; color: #000; font-size: 0.6rem; padding: 2px 4px; border-radius: 4px; font-weight: 900; }
    .chat-container { flex: 1; overflow-y: auto; margin: 20px 0; padding: 10px; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; }
    .msg.user { background: #111; align-self: flex-end; border: 1px solid #222; color: #eee; }
    .msg.ai { background: #fff; color: #000; align-self: flex-start; font-weight: 500; }
    .status-bar { font-size: 0.75rem; color: #555; text-align: center; margin-bottom: 10px; }
    .input-area { display: flex; gap: 10px; width: 100%; max-width: 500px; margin: 0 auto; }
    .input-area input { flex: 1; background: #050505; border: 1px solid #222; border-radius: 12px; padding: 16px; color: #fff; font-size: 1rem; outline: none; }
    .input-area button { background: #fff; color: #000; border: none; padding: 0 24px; border-radius: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    body.theme-noir { background: #0a0a0a; color: #fff; font-family: 'Courier New', Courier, monospace; }
    body.theme-milano { background: #1c1c1c; color: #e5e5e5; }
  </style>
</head>
<body>

  <!-- Окно крипто-пейволла -->
  <div id="paywall" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999;">
    <h2 style="font-size:2rem; font-weight:900; margin-bottom:10px;">MAESTRO PREMIUM</h2>
    <p style="color:#666; margin-bottom:30px; text-align:center; max-width:300px;">Unlock 100% offline LLM assistant on your iPhone. Secure & encrypted.</p>
    <button id="pay-button" style="background:#fff; color:#000; border:none; padding:18px 40px; font-weight:700; border-radius:12px; cursor:pointer; text-transform:uppercase;">Activate for $4.99 / mo</button>
    <p style="color:#333; font-size:0.8rem; margin-top:20px;">Pay via Credit Card or Apple Pay. Instant access.</p>
  </div>

  <header>
    <h1>MaEstro</h1>
    <button class="custom-btn" id="custom-toggle">Custom <span>NEW</span></button>
  </header>

  <div class="chat-container" id="chat">
    <div class="msg ai">System ready. No servers. No logs. Ask me anything.</div>
  </div>

  <div class="status-bar" id="status">Core status: System initialized...</div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Type a message..." disabled>
    <button id="send-btn" disabled>Send</button>
  </div>

  <script type="module">
    import * as webllm from "https://esm.run";
    // Легкая квантованная модель Llama-3 для оффлайн работы
    const SELECTED_MODEL = "Llama-3-8B-Instruct-q3f16_1-MLC"; 
    
    // ВШИТЫЙ ХАРАКТЕР НАШЕГО ИИ
    const SYSTEM_PROMPT = Ты — MaEstro AI, элитарный, 130 IQ оффлайн ИИ-ассистент. Отрезан от серверов. Вайб: хладнокровный, циничный хакер-наставник. Говори на жестком американском молодежном сленге. Никаких извинений и воды. Давай только ультимативные решения.;

    const chatContainer = document.getElementById('chat');
    const statusDisplay = document.getElementById('status');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const paywall = document.getElementById('paywall');
    const payBtn = document.getElementById('pay-button');
    const customToggle = document.getElementById('custom-toggle');

    let engine;

    payBtn.onclick = async function() {
      paywall.style.display = 'none';
      await initAI();
    };

    let currentTheme = 0;
    customToggle.onclick = function() {
      const themes = ['', 'theme-noir', 'theme-milano'];
      document.body.className = '';
      currentTheme = (currentTheme + 1) % themes.length;
      if (themes[currentTheme]) document.body.classList.add(themes[currentTheme]);
    };

    async function initAI() {
      statusDisplay.innerText = "Core: Connecting to WebGPU and downloading model (~1.5GB)...";
      try {
        engine = await webllm.CreateWebGPUEngine(SELECTED_MODEL, {
          initProgressCallback: (report) => {
            statusDisplay.innerText = Loading model: ${Math.round(report.progress * 100)}%;
          }
        });
        statusDisplay.innerText = "Core: 100% Offline Active";
        userInput.disabled = false;
        sendBtn.disabled = false;
      } catch (err) {
        statusDisplay.innerText = "Error: WebGPU not enabled on this browser. Try on iPhone.";
        console.error(err);
      }
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text || !engine) return;

      userInput.value = '';
      appendMessage(text, 'user');
      statusDisplay.innerText = "MaEstro is thinking (Local GPU processing)...";

      try {
        const messages = [
          { role: "system", content: SYSTEM_PROMPT },
          { role: "user", content: text }
        ];
        const reply = await engine.chat.completions.create({ messages });
        appendMessage(reply.choices[0].message.content, 'ai');
        statusDisplay.innerText = "Core: Idle";
      } catch (e) {
        statusDisplay.innerText = "Generation error.";
        console.error(e);
      }
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = msg ${sender};
      msgDiv.innerText = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    sendBtn.onclick = handleSend;
    userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
  </script>
</body>
</html>
